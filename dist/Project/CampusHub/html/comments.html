<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub Comments</title>

  <script type="module" crossorigin src="/assets/comments-fnqGoo8H.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="stylesheet" crossorigin href="/assets/style-BApQYzzb.css">
</head>

<body>
    <button id="comments-button">Comments</button>
    <div id="comments-section" hidden>
        <h2>Comments:</h2>
        <div id="comments-list"></div>
        <!-- Comments will be dynamically added here -->
        <button id="view-more-comments-button" hidden>View More Comments</button>
        <form id="comment-form">
            <div class="comment-input-container">
                <textarea name="comment" id="comment" placeholder="Leave your comment here..."
                    maxlength="1000"></textarea>
                <p id="char-count">0/1000</p>
            </div>
            <button id="post" disabled>Post</button>
        </form>
    </div>

</body>

</html>
