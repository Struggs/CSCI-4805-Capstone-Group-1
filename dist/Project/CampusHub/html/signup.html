<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusHub Sign Up</title>

  <script type="module" crossorigin src="/assets/signup-tZe0BIHI.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="/assets/supabaseClient-acy1xj74.js">
  <link rel="stylesheet" crossorigin href="/assets/signup-DBqV3KBD.css">
</head>

<body>

    <main class="signup-container">

        <h1>CampusHub</h1>
        <h2>Create Account</h2>

        <form id="signup-form">

            <label for="email">APSU Student Email</label>
            <input
                type="email"
                id="email"
                placeholder="student@students.apsu.edu"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="/Project/CampusHub/html/index.html">Sign In</a>
        </p>

    </main>


</body>
</html>
