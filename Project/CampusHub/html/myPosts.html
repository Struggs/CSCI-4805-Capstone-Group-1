
<main class="my-posts-page">

    <div class="my-posts-feed">

        <div id="my-posts"></div>

        <template id="my-posts-template">

            <article class="post-card">

                <div class="post-top-row">

                    <div class="post-content">

                        <div class="post-header">

                            <img class="post-profile-picture"
                                 alt="Student profile"
                                 hidden>

                            <div class="post-author-info">

                                <div class="post-author-line">

                                    <p class="post-author"></p>

                                    <span class="post-audience"></span>

                                </div>

                                <p class="post-stats"></p>

                            </div>

                        </div>

                        <div class="post-body">

                            <div class="post-text">

                                <h3 class="post-title"></h3>

                                <p class="post-desc"></p>

                            </div>

                        </div>

                    </div>

                    <div class="post-media">

                        <img class="post-image"
                             alt="Post attachment"
                             hidden>

                    </div>

                </div>

                <div class="post-footer">

                    <div class="post-actions">

                        <button type="button"
                                class="edit-post-interface-button">
                            Edit Post
                        </button>

                        <button type="button"
                                class="delete-post-button">
                            Delete Post
                        </button>

                    </div>

                </div>

            </article>

        </template>

    </div>

    <section class="editPostInterface">

        <div id="editPostInterface"
             class="interface">

            <h2>Edit Post</h2>

            <div id="currentPostImageContainer"
                 style="display: none;">

                <p>Current picture:</p>

                <img id="currentPostImage"
                     alt="Current post picture">

            </div>

            <label for="postTitle">Title</label>

            <input type="text"
                   id="postTitle"
                   placeholder="Enter a post title">

            <label for="postDescription">Description</label>

            <textarea id="postDescription"
                      placeholder="Write your post..."
                      maxlength="500"
                      required></textarea>

            <label for="postImage">Replace Picture (optional)</label>

            <input type="file"
                   id="postImage"
                   accept="image/jpeg,image/png">

            <label for="audienceFilter">Target Audience *</label>

            <select id="audienceFilter"
                    name="audienceFilter"
                    onchange="handleEditAudienceChange()">

                <option value="All Students">All Students</option>
                <option value="Major">Specific Major</option>
                <option value="Course Subject">Course Subject</option>
                <option value="Year">Class Standing</option>
                <option value="Transfer Students Only">Transfer Students Only</option>

            </select>

            <div id="majorSelectContainer" style="display: none;">

                <label for="majorSelect">Select Major</label>

                <select id="majorSelect">

                    <option value="">Select a major...</option>
                    <option value="Accounting">Accounting</option>
                    <option value="Agriculture">Agriculture</option>
                    <option value="Art">Art</option>
                    <option value="Biology">Biology</option>
                    <option value="Business Administration">Business Administration</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Communication">Communication</option>
                    <option value="Computer Information Systems">Computer Information Systems</option>
                    <option value="Computer Information Technology">Computer Information Technology</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Criminal Justice">Criminal Justice</option>
                    <option value="Economics">Economics</option>
                    <option value="Education">Education</option>
                    <option value="Engineering Technology">Engineering Technology</option>
                    <option value="English">English</option>
                    <option value="Finance">Finance</option>
                    <option value="History">History</option>
                    <option value="Kinesiology">Kinesiology</option>
                    <option value="Management">Management</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Nursing">Nursing</option>
                    <option value="Physics">Physics</option>
                    <option value="Political Science">Political Science</option>
                    <option value="Psychological Science">Psychological Science</option>
                    <option value="Social Work">Social Work</option>
                    <option value="Sociology">Sociology</option>
                    <option value="Theatre Arts">Theatre Arts</option>
                    <option value="University Studies">University Studies</option>

                </select>

            </div>

            <div id="courseSubjectContainer" style="display: none;">

                <label for="courseSubjectSelect">Select Course Subject</label>

                <select id="courseSubjectSelect">

                    <option value="">Select a subject...</option>
                    <option value="ACCT">ACCT</option>
                    <option value="AGRI">AGRI</option>
                    <option value="ANTH">ANTH</option>
                    <option value="ART">ART</option>
                    <option value="ASTR">ASTR</option>
                    <option value="BIOL">BIOL</option>
                    <option value="CHEM">CHEM</option>
                    <option value="COMM">COMM</option>
                    <option value="CSCI">CSCI</option>
                    <option value="CRJ">CRJ</option>
                    <option value="DANC">DANC</option>
                    <option value="ECON">ECON</option>
                    <option value="EDUC">EDUC</option>
                    <option value="ENGL">ENGL</option>
                    <option value="FINC">FINC</option>
                    <option value="FREN">FREN</option>
                    <option value="GEOG">GEOG</option>
                    <option value="GEOL">GEOL</option>
                    <option value="GERM">GERM</option>
                    <option value="HIST">HIST</option>
                    <option value="MATH">MATH</option>
                    <option value="MGMT">MGMT</option>
                    <option value="MKTG">MKTG</option>
                    <option value="MUS">MUS</option>
                    <option value="NURS">NURS</option>
                    <option value="PHIL">PHIL</option>
                    <option value="PHYS">PHYS</option>
                    <option value="POLS">POLS</option>
                    <option value="PSYC">PSYC</option>
                    <option value="SOC">SOC</option>
                    <option value="SPAN">SPAN</option>
                    <option value="THEA">THEA</option>

                </select>

            </div>

            <div id="yearSelectContainer" style="display: none;">

                <label for="yearSelect">Select Class Standing</label>

                <select id="yearSelect">

                    <option value="">Select a class year...</option>
                    <option value="Freshman">Freshman</option>
                    <option value="Sophomore">Sophomore</option>
                    <option value="Junior">Junior</option>
                    <option value="Senior">Senior</option>
                    <option value="Undeclared">Undeclared</option>

                </select>

            </div>

            <div class="edit-post-buttons">

                <button type="button" onclick="editSubmission()">
                    Save Changes
                </button>

                <button type="button" onclick="closeEditPostInterface()">
                    Cancel
                </button>

            </div>

        </div>

    </section>

</main>
