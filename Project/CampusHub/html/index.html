<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CampusHub | Sign In</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-header">
                <h1>CampusHub</h1>
                <p>Connect with your campus.</p>
            </div>

            <form class="login-form">

                <div class="form-group">
                    <label for="email">APSU Student Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="username@students.apsu.edu"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="sign-in-button">
                    Sign In
                </button>

            </form>

            <!-- testing only remove before final release -->
            <div class="test-login">
                <a href="CampusHub.html">bypass login for testing</a>
            </div>

            <div class="create-account">
                <p>New to CampusHub?</p>
                <a href="#">Create an account</a>
            </div>

        </div>

    </main>
