<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub Messages</title>
    <link rel="stylesheet" href="../css/messaging.css">
</head>
<body>
    <main id="messages-page" class="messages-page">
        <h1>Messages</h1>
        <section id="conversation-list">
            <h2>Conversations</h2>
        <button type="button" id="new-conversation-button">
        New Conversation
    </button>
    <select id="student-select" hidden>
        <option value="">Select a student</option>
    </select>
</section>
        <section id="current-chat">
        <h2>Select a conversation</h2>
<div id="message-history"></div>
            <form id="message-form">
            <label for="message-input">Message</label>
            <textarea
            id="message-input"
            maxlength="1000"
            placeholder="Type a message"
            required>
        </textarea>
        <button type="submit" id="send-message-button">Send</button>
        </form>
        </section>
    </main>
</body>
</html>
