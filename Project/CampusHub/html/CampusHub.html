<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub | Dashboard</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/feed.css">
    <link rel="stylesheet" href="../css/myPosts.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/messaging.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <!-- Main header -->
    <header>
        <div class="main-header">
            <h1>Campus Hub</h1>
            <button onclick="window.location.href='index.html'" style="margin-right:auto">Log Out</button>
            <p>Austin Peay State University</p>

        </div>
    </header>

    <!-- Dashboard layout -->
    <div class="dashboard-layout">
        <nav class="navbar">

            <!-- Current user profile -->
            <div class="sidebar-user">
                <img id="sidebar-profile-picture" src="../images/default-profile.png" alt="Profile Picture">
                <span id="sidebar-profile-name">Loading...</span>
            </div>

            <!-- Navigation links -->
            <a href="feed.html" class="nav-button" data-page="feed.html"> 
                <i class="fa-solid fa-house"></i>
                  Activity Feed</a>
            <a href="myPosts.html" class="nav-button" data-page="myPosts.html">
                <i class="fa-solid fa-file-lines"></i>
                  My Posts</a>
            <a href="marketplace.html" class="nav-button" data-page="marketplace.html">
                <i class="fa-solid fa-suitcase"></i>
                  Marketplace</a>
            <a href="messages.html" class="nav-button" data-page="messages.html">
                <i class="fa-solid fa-envelope"></i>
                  Messages</a>
            <a href="profile.html" class="nav-button" data-page="profile.html">
                <i class="fa-solid fa-circle-user"></i>
                  Profile</a>
        </nav>

        <!-- Dynamic page content -->
        <main class="main-content"></main>
    </div>

    <!-- Footer -->
    <footer>
        <div></div>
    </footer>

    <!-- Main page JavaScript -->
    <script type="module" src="../javascript/mainpage.js"></script>
</body>

</html>
